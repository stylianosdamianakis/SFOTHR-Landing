<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SFOTH: Reforged</title>
    <meta
      name="description"
      content="Sword Fights on the Heights IV: Reforged — play the game, join the Discord, or read the wiki."
    />
    <link rel="canonical" href="https://sfothr.com/" />
    <meta property="og:title" content="SFOTH: Reforged" />
    <meta
      property="og:description"
      content="Play the game, join the Discord, or read the wiki."
    />
    <meta property="og:url" content="https://sfothr.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://sfothr.com/assets/sfothr-logo.png" />
    <meta name="theme-color" content="#c43c18" />
    <link rel="icon" href="assets/sfothr-logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/sfothr-logo.png" />
    <link rel="preload" href="assets/sfothr-background.jpg" as="image" />
    <link rel="preload" href="assets/sfothr-logo.png" as="image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <img
        class="backdrop-image"
        src="assets/sfothr-background.jpg"
        alt=""
        width="1920"
        height="1017"
        fetchpriority="high"
      />
    </div>

    <main class="stage">
      <h1 class="brand">
        <img
          class="logo"
          src="assets/sfothr-logo.png"
          alt="Sword Fights on the Heights IV: Reforged"
          width="375"
          height="375"
        />
      </h1>

      <nav class="links" aria-label="Official links">
        <a
          class="link"
          href="https://www.roblox.com/games/77483797026305/Sword-Fights-on-the-Heights-IV-Reforged"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">
            <img
              src="assets/roblox-icon.png"
              alt=""
              width="256"
              height="256"
              decoding="async"
            />
          </span>
          <span class="label">Game</span>
        </a>
        <a
          class="link"
          href="https://wiki.sfothr.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">
            <img
              src="assets/wiki-icon.png"
              alt=""
              width="256"
              height="256"
              decoding="async"
            />
          </span>
          <span class="label">Wiki</span>
        </a>
        <a
          class="link"
          href="https://discord.gg/sfoth"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">
            <img
              src="assets/discord-icon.png"
              alt=""
              width="256"
              height="256"
              decoding="async"
            />
          </span>
          <span class="label">Discord</span>
        </a>
      </nav>
    </main>
  </body>
</html>
